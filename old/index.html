<section id="whats-new">
  <h2>🆕 Что нового в Skyle?</h2>
  <div id="updates">Загрузка обновлений...</div>
</section>

<script>
fetch('../whatsnew.md')
  .then(response => {
    if (!response.ok) {
      throw new Error('Не удалось загрузить обновления');
    }
    return response.text();
  })
  .then(markdown => {
    document.getElementById('updates').textContent = markdown;
  })
  .catch(error => {
    document.getElementById('updates').textContent =
      'Не удалось загрузить список обновлений.';
    console.error(error);
  });
</script>
